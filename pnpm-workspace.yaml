packages:
  - 'packages/*'
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3

# Pinned exactly for every package that resolves it (@tailwindcss/node pins it, vite takes it as an optional peer).
overrides:
  lightningcss: 1.32.0
  vite: 7.3.7
  next: 16.4.3
  "@vitest/mocker": ">=4.1.12"
  tinypool: ">=2.1.2"
  tmp: ">=0.2.7"
  uuid: ">=11.1.1"
  basic-ftp: ">=6.2.3"
  "@puppeteer/browsers": ">=3.2.5"
  "proxy-agent": ">=8.0.1"
  "ip-address": ">=10.7.4"
  zod: ">=4.6.6"
  js-yaml: ">=4.1.1"
  body-parser: ">=1.20.9"
  fast-uri: ">=3.1.9"
